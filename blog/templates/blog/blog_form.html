{% extends 'catalog/base.html' %}

{% block content %}
<h1>{% if object %}Редактировать статью{% else %}Создать статью{% endif %}</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    
    {{ form.as_p }}
    
    <button type="submit">Сохранить</button>
    <a href="{% url 'blog_list' %}">Отмена</a>
</form>
{% endblock %}
