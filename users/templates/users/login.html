{% extends "catalog/base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<h1>Вход</h1>

<form method="post">
    {% csrf_token %}

    {% if form.non_field_errors %}
        <div style="color: red;">
            {{ form.non_field_errors }}
        </div>
    {% endif %}

    {{ form.as_p }}

    <button type="submit">Войти</button>
    <a href="{% url 'users:register' %}">Нет аккаунта? Зарегистрироваться</a>
</form>
{% endblock %}
