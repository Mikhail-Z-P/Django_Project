{% extends "catalog/base.html" %}

{% block title %}Удаление товара{% endblock %}

{% block content %}
<h1>Удалить товар?</h1>
<p>Вы уверены, что хотите удалить «{{ object.name }}»? Это действие нельзя отменить.</p>

<form method="post">
  {% csrf_token %}
  <button type="submit">Да, удалить</button>
  <a href="{% url 'catalog:home' %}">Отмена</a>
</form>
{% endblock %}
